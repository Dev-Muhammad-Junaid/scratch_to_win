name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Package — pub get
        run: flutter pub get

      - name: Package — format
        run: dart format --output=none --set-exit-if-changed .

      - name: Package — analyze
        run: flutter analyze --fatal-infos

      - name: Package — test
        run: flutter test

      - name: Example — pub get
        working-directory: example
        run: flutter pub get

      - name: Example — analyze
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Example — test
        working-directory: example
        run: flutter test

      - name: Example — web build (verify)
        working-directory: example
        run: flutter build web --release --base-href /scratch_to_win/

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
